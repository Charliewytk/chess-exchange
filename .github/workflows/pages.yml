# Static FEN→WDL demo only (docs/). Play money, not a book.
# No npm start, no live exchange, no chess.com login, no credentials.
# Charles still has one remaining click (agents never click Settings):
# Settings → Pages → Source = GitHub Actions
# Then Save. Do not enable Pages from this workflow. Do not touch the owner user-site.
name: Deploy Pages demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Fails with "Get Pages site failed" until Charles clicks
      # Settings → Pages → Source = GitHub Actions
      - name: Configure Pages (needs Settings → Pages → Source = GitHub Actions)
        uses: actions/configure-pages@v5
      - name: Upload docs/
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
  deploy:
    needs: upload
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
